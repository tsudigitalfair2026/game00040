<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>ペンギンジャンプチャレンジ</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}
html,body{
width:100%;
height:100%;
overflow:hidden;
touch-action:none;
font-family:sans-serif;
background:#87ceeb;
}
.screen{
width:100%;
height:100vh;
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
padding:20px;
text-align:center;
}
.screen.active{
display:flex;
}
h1{
font-size:2rem;
margin-bottom:15px;
}
p{
line-height:1.6;
margin-bottom:10px;
}
button{
font-size:1.2rem;
padding:16px 30px;
border:none;
border-radius:16px;
background:#1976d2;
color:#fff;
margin-top:15px;
min-width:220px;
min-height:60px;
}
#gameScreen{
justify-content:flex-start;
padding:0;
}
#hud{
width:100%;
display:flex;
justify-content:space-around;
align-items:center;
padding:12px;
font-size:1rem;
font-weight:bold;
background:#ffffffdd;
z-index:10;
}
#gameArea{
position:relative;
width:100%;
flex:1;
overflow:hidden;
background:
linear-gradient(#9be7ff 0%,#9be7ff 70%,#e6f7ff 70%,#ffffff 100%);
}
#penguin{
position:absolute;
left:18%;
bottom:90px;
font-size:58px;
z-index:5;
user-select:none;
}
.ground{
position:absolute;
bottom:0;
left:0;
width:100%;
height:90px;
background:#f5f5f5;
border-top:4px solid #bdbdbd;
}
.obstacle{
position:absolute;
bottom:90px;
user-select:none;
}
#tapGuide{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:1.1rem;
font-weight:bold;
background:#ffffffdd;
padding:12px 18px;
border-radius:12px;
pointer-events:none;
}
#rank{
font-size:2rem;
margin:15px 0;
color:#d84315;
font-weight:bold;
}
.small{
font-size:0.95rem;
}
</style>
</head>
<body>

<div id="startScreen" class="screen active">
<h1>🐧 ペンギンジャンプチャレンジ</h1>

<p>
せまい間隔でやってくる氷をジャンプでよけよう！<br>
時間がたつほどスピードアップ！<br>
障害物にぶつかったら即ゲームオーバー！
</p>

<p class="small">
操作方法<br>
タップ・クリック・スペースキーでジャンプ<br>
長押しで少し高くジャンプ
</p>

<button id="startBtn">スタート</button>
</div>

<div id="gameScreen" class="screen">

<div id="hud">
<div>スコア <span id="score">0</span></div>
<div>残り <span id="time">30</span>秒</div>
<div>速度 <span id="speed">1.0</span>x</div>
</div>

<div id="gameArea">
<div id="tapGuide">タップしてジャンプ！</div>
<div id="penguin">🐧</div>
<div class="ground"></div>
</div>

</div>

<div id="resultScreen" class="screen">
<h1>結果発表</h1>

<p>最終スコア</p>
<h2 id="finalScore">0</h2>

<div id="rank">C</div>

<button id="retryBtn">もう一度遊ぶ</button>
</div>

<script>
const startScreen=document.getElementById("startScreen");
const gameScreen=document.getElementById("gameScreen");
const resultScreen=document.getElementById("resultScreen");

const startBtn=document.getElementById("startBtn");
const retryBtn=document.getElementById("retryBtn");

const scoreEl=document.getElementById("score");
const timeEl=document.getElementById("time");
const speedEl=document.getElementById("speed");

const finalScoreEl=document.getElementById("finalScore");
const rankEl=document.getElementById("rank");

const gameArea=document.getElementById("gameArea");
const penguin=document.getElementById("penguin");
const tapGuide=document.getElementById("tapGuide");

let gameRunning=false;

let score=0;
let timeLeft=30;

let y=0;
let velocity=0;

let gravity=0.8;
let jumpPower=-13;
let holdJump=false;

let obstacleSpeed=8.5;

let obstacles=[];

let animationId;
let timerInterval;
let spawnInterval;
let speedInterval;

const groundY=90;

function showScreen(screen){
[startScreen,gameScreen,resultScreen].forEach(s=>{
s.classList.remove("active");
});
screen.classList.add("active");
}

function startGame(){

showScreen(gameScreen);

score=0;
timeLeft=30;

y=0;
velocity=0;

obstacleSpeed=8.5;

scoreEl.textContent="0";
timeEl.textContent="30";
speedEl.textContent="1.0";

tapGuide.style.display="block";

obstacles.forEach(o=>o.el.remove());
obstacles=[];

gameRunning=true;

timerInterval=setInterval(()=>{
timeLeft--;
timeEl.textContent=timeLeft;

if(timeLeft<=0){
endGame(true);
}
},1000);

spawnInterval=setInterval(()=>{
createObstacle();
},700);

speedInterval=setInterval(()=>{
if(gameRunning){
obstacleSpeed+=1;
}
},5000);

gameLoop();
}

function createObstacle(){

if(!gameRunning)return;

const obstacle=document.createElement("div");

obstacle.className="obstacle";

const types=["🧊","❄️","🪨"];

const size=40+Math.random()*20;

obstacle.textContent=
types[Math.floor(Math.random()*types.length)];

obstacle.style.fontSize=size+"px";

gameArea.appendChild(obstacle);

obstacles.push({
el:obstacle,
x:gameArea.clientWidth+50,
width:size,
height:size,
passed:false
});
}

function jumpStart(){

if(!gameRunning)return;

tapGuide.style.display="none";

if(y===0){
velocity=jumpPower;
}

holdJump=true;
}

function jumpEnd(){
holdJump=false;
}

function gameLoop(){

if(!gameRunning)return;

velocity+=gravity;

if(holdJump && velocity<0){
velocity-=0.35;
}

y-=velocity;

if(y<0){
y=0;
velocity=0;
}

penguin.style.bottom=(groundY+y)+"px";

speedEl.textContent=(obstacleSpeed/8.5).toFixed(1);

for(let i=obstacles.length-1;i>=0;i--){

const o=obstacles[i];

o.x-=obstacleSpeed;

o.el.style.left=o.x+"px";

const penguinBox={
left:gameArea.clientWidth*0.18,
right:(gameArea.clientWidth*0.18)+50,
top:groundY+y,
bottom:groundY+y+50
};

const obstacleBox={
left:o.x,
right:o.x+o.width,
top:groundY,
bottom:groundY+o.height
};

if(
penguinBox.right > obstacleBox.left+5 &&
penguinBox.left < obstacleBox.right-5 &&
penguinBox.bottom > obstacleBox.top+5 &&
penguinBox.top < obstacleBox.bottom-5
){
endGame(false);
return;
}

if(!o.passed && o.x < gameArea.clientWidth*0.18){
o.passed=true;
score+=10;
scoreEl.textContent=score;
}

if(o.x < -120){
o.el.remove();
obstacles.splice(i,1);
}
}

animationId=requestAnimationFrame(gameLoop);
}

function endGame(clear){

gameRunning=false;

cancelAnimationFrame(animationId);

clearInterval(timerInterval);
clearInterval(spawnInterval);
clearInterval(speedInterval);

finalScoreEl.textContent=score;

let rank="C";

if(score>=350){
rank="S";
}else if(score>=250){
rank="A";
}else if(score>=150){
rank="B";
}

if(!clear){
rank+="（ゲームオーバー）";
}

rankEl.textContent=rank;

showScreen(resultScreen);
}

startBtn.addEventListener("click",startGame);
retryBtn.addEventListener("click",startGame);

document.addEventListener("touchstart",(e)=>{
e.preventDefault();
jumpStart();
},{passive:false});

document.addEventListener("touchend",(e)=>{
e.preventDefault();
jumpEnd();
},{passive:false});

document.addEventListener("mousedown",jumpStart);
document.addEventListener("mouseup",jumpEnd);

document.addEventListener("keydown",(e)=>{
if(e.code==="Space"){
e.preventDefault();
jumpStart();
}
});

document.addEventListener("keyup",(e)=>{
if(e.code==="Space"){
jumpEnd();
}
});
</script>

</body>
</html>
